
<!DOCTYPE html>
<html>
<head>
    <title>Ryama Urananiwe</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #000428, #004e92);
            font-family: Arial, sans-serif;
        }

        h1 {
            color: white;
            font-size: 60px;
            text-align: center;
            text-shadow: 0 0 15px #00ffff;
            letter-spacing: 5px;
        }

        .container {
            padding: 40px;
            border: 2px solid #00ffff;
            border-radius: 20px;
            box-shadow: 0 0 30px #00ffff;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Ryama Urananiwe</h1>
    </div>

</body>
</html>
